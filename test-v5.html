</main><script>
'use strict';
const $=id=>document.getElementById(id),rnd=n=>Math.floor(Math.random()*n),choose=a=>a[rnd(a.length)],names=['你','赤隼','青藤','金砂'],colors=['#54aaff','#f3787f','#62d7a3','#f3cc69'];
const Z=['亚马孙','阿拉伯','大瑟提斯','第勒尼安','乌托邦','埃律西昂','希腊','塔尔西斯','水手谷','火卫一'];
const roles=[['飞行员',2,'分配2人登船；给飞船改道'],['士兵',1,'登船1人；可移除目标并移动火卫一宇航员'],['旅行代理',3,'3人必须登同一艘船'],['蛇蝎美人',1,'登船1人；替换有你驻守地区的对手'],['破坏者',1,'登船1人；炸毁一艘停泊船'],['特工',2,'分别登上不同飞船；令一艘船提前发射'],['科学家',2,'分配2人登船；简化事件奖励'],['探险家',1,'登船1人；在火星移动最多3步'],['招募员',1,'登船1人；回收所有职业']];
let G,stage='setup',chosenRole=-1,queue=[],current=null,plan=[],needed=0,selectedShip=-1,selectedZone=-1,missionChoice=0,steps=[],stepNo=0;
function makeShip(){return {cap:choose([3,3,4,4,5]),dest:rnd(10),people:[],launched:false,dead:false}}
function fresh(){G={round:1,ships:Array.from({length:4},makeShip),areas:Z.map((z,i)=>({people:[],value:choose([1,2,3]),shown:false,pool:0})),used:Array.from({length:4},()=>[]),scores:[0,0,0,0],mission:[rnd(9),rnd(9),rnd(9),rnd(9)],offers:[rnd(9),rnd(9)],logs:[],first:0};while(G.offers[0]===G.offers[1])G.offers[1]=rnd(9);G.ships.forEach((s,p)=>s.people.push(p));stage='setup';chosenRole=-1;queue=[];current=null;plan=[];needed=0;selectedShip=-1;selectedZone=-1;missionChoice=0;steps=[];stepNo=0;note('四支队伍各有一名宇航员在发射台。');draw()}
function note(s){G.logs.unshift('第'+G.round+'回合｜'+s)}
function count(arr,p){return arr.filter(x=>x===p).length}
function candidates(n=1,distinct=false){return G.ships.map((s,i)=>({s,i})).filter(({s,i})=>!s.launched&&s.people.length+n<=s.cap&&(!distinct||!plan.includes(i))).map(x=>x.i)}
function renderMap(){let svg=$('mars'),cx=200,cy=200,r=178,inner=68;let h='<circle cx="200" cy="200" r="184" fill="#5e3029" stroke="#ce8b68" stroke-width="4"/>';for(let i=0;i<9;i++){let a=(-90+i*40)*Math.PI/180,b=(-90+(i+1)*40)*Math.PI/180,mid=(a+b)/2;let x=(rad,angle)=>cx+rad*Math.cos(angle),y=(rad,angle)=>cy+rad*Math.sin(angle);let d=`M ${x(inner,a)} ${y(inner,a)} L ${x(r,a)} ${y(r,a)} A ${r} ${r} 0 0 1 ${x(r,b)} ${y(r,b)} L ${x(inner,b)} ${y(inner,b)} A ${inner} ${inner} 0 0 0 ${x(inner,a)} ${y(inner,a)} Z`;let tx=x(124,mid),ty=y(124,mid);h+=`<g class="region ${selectedZone===i?'selected':''}" data-z="${i}"><path d="${d}"/><text x="${tx}" y="${ty-8}">${Z[i]}</text><text class="count" x="${tx}" y="${ty+10}">${counts(i)}</text></g>`}h+=`<g class="region ${selectedZone===9?'selected':''}" data-z="9"><circle cx="200" cy="200" r="65" fill="#3e5c7a" stroke="#b2d4e7" stroke-width="2"/><text x="200" y="193">火卫一</text><text x="200" y="211">${counts(9)}</text></g>`;svg.innerHTML=h;svg.querySelectorAll('[data-z]').forEach(e=>e.onclick=()=>zoneClick(+e.dataset.z))}
function counts(i){let a=G.areas[i].people;return a.length?names.map((n,p)=>count(a,p)?['🔵','🔴','🟢','🟡'][p]+count(a,p):'').filter(Boolean).join(' '):'—'}
function draw(){ $('round').textContent='第 '+G.round+'/10 回合';$('intro').classList.toggle('hidden',stage!=='setup');$('game').classList.toggle('hidden',stage==='setup');$('missions').innerHTML=G.offers.map((z,i)=>`<button class="card selectable ${missionChoice===i?'active':''}" data-m="${i}">任务${i+1}：终局驻守${Z[z]} +5分</button>`).join('');document.querySelectorAll('[data-m]').forEach(e=>e.onclick=()=>{missionChoice=+e.dataset.m;draw()});$('scores').innerHTML=names.map((n,p)=>`<span style="color:${colors[p]}">● ${n} ${G.scores[p]}分</span>`).join('');$('missionNote').textContent=stage==='setup'?'选择你的秘密任务':'你的秘密任务：驻守 '+Z[G.mission[0]]+'（终局+5分）';
const shipSeats=s=>Array.from({length:s.cap},(_,j)=>`<i class="seat ${s.people[j]===undefined?'':'p'+s.people[j]}"></i>`).join('');
const docked=G.ships.map((s,i)=>({s,i})).filter(({s})=>!s.launched&&s.people.length<s.cap);
const full=G.ships.map((s,i)=>({s,i})).filter(({s})=>!s.launched&&s.people.length===s.cap);
const launched=G.ships.map((s,i)=>({s,i})).filter(({s})=>s.launched);
$('ships').innerHTML=docked.length?docked.map(({s,i})=>`<button class="card ${stage==='manual'&&candidates(1).includes(i)?'selectable':''} ${selectedShip===i?'active':''}" data-s="${i}"><div class="row"><b>${'ABCD'[i]}号飞船</b><span class="badge">${s.people.length}/${s.cap}</span></div><div>${shipSeats(s)}</div><div>📍 ${Z[s.dest]}</div><small>🟢 停泊中 · 剩余${s.cap-s.people.length}座</small></button>`).join(''):'<div class="ship-empty">当前没有可登船的飞船</div>';
$('fullShips').innerHTML=full.length?full.map(({s,i})=>`<button class="ship-mini ship-full ${selectedShip===i?'active':''}" data-s="${i}"><div class="row"><b>${'ABCD'[i]}船</b><span class="badge">${s.people.length}/${s.cap}</span></div><div>${shipSeats(s)}</div><small>⏳ 满员 · ${Z[s.dest]}</small></button>`).join(''):'<div class="ship-empty">暂无待发射的满员飞船</div>';
$('launchedShips').innerHTML=launched.length?launched.map(({s,i})=>`<button class="ship-mini ship-launched ${selectedShip===i?'active':''}" data-s="${i}"><div class="row"><b>🚀 ${'ABCD'[i]}船</b><span class="badge">${s.dead?'损毁':s.people.length+'/'+s.cap}</span></div><div>${s.dead?'💥 已损毁':shipSeats(s)}</div><small>${s.dead?'不会降落':'目的地 '+Z[s.dest]+' · 等待降落'}</small></button>`).join(''):'<div class="ship-empty">暂无已发射飞船</div>';
$('launchedCount').textContent='（'+launched.filter(({s})=>!s.dead).length+'艘）';
document.querySelectorAll('[data-s]').forEach(e=>e.onclick=()=>shipClick(+e.dataset.s));renderMap();$('log').innerHTML=G.logs.slice(0,120).map(t=>`<div>${t}</div>`).join('');$('shipHelp').textContent=stage==='manual'?'正在执行你的职业：请根据提示点击飞船或地图。':'飞船满员会在当前职业效果完全执行后发射；发射的飞船在本回合所有职业执行完后降落。';$('manual').classList.toggle('hidden',stage!=='manual');$('next').classList.toggle('hidden',stage!=='step'&&stage!=='roundend');$('roles').classList.toggle('hidden',stage!=='choose');$('warning').textContent='';if(stage==='choose'){$('phase').textContent='秘密选择职业。AI也会同时选择；公开后按9→1号行动。';$('roles').innerHTML=roles.map((r,i)=>`<button class="card selectable" data-role="${i}" ${G.used[0].includes(i)?'disabled':''}><b>${i+1}号 ${r[0]}</b><br><small>${r[2]}</small></button>`).join('');document.querySelectorAll('[data-role]').forEach(e=>e.onclick=()=>startRound(+e.dataset.role))}if(stage==='manual')manualDraw();if(stage==='step'){$('phase').textContent=steps[stepNo]?.title||'等待';$('next').textContent='下一步 ▶'}if(stage==='roundend'){$('phase').textContent='本回合飞船已降落，下一回合可以重新选择职业。';$('next').textContent='进入下一回合 ▶'}}
function shipClick(i){if(stage!=='manual')return;if(current?.p!==0)return;if(current.mode==='board'){let distinct=current.id===5,same=current.id===2;if(!candidates(1,distinct).includes(i)||G.ships[i].cap-G.ships[i].people.length<=plan.filter(x=>x===i).length||same&&plan.length&&plan[0]!==i){$('warning').textContent='该船不能登：请检查剩余座位、特工不同船或旅行代理同船要求。';return}plan.push(i);selectedShip=i;if(plan.length>=needed){current.mode='effect';selectedShip=-1}draw()}else if(current.mode==='effect'&&[0,4,5].includes(current.id)){selectedShip=i;draw()}}
function zoneClick(i){if(stage!=='manual'||current?.p!==0)return;if(current.mode==='moveTo'){let a=current.moveFrom;if(i<9&&a<9&&(i===(a+1)%9||i===(a+8)%9)){let from=G.areas[a],to=G.areas[i];from.people.splice(from.people.indexOf(0),1);to.people.push(0);to.shown=true;note('你移动宇航员：'+Z[a]+'→'+Z[i]);current.moves++;current.moveFrom=i;selectedZone=i;if(current.moves===3){current.mode='effect';finishAction();return}draw()}else $('warning').textContent='只能移动到相邻区域';return}if(current.mode!=='effect')return;selectedZone=i;draw()}
function manualDraw(){let id=current.id,board=current.mode==='board';$('options').innerHTML='';if(board){let text=id===2?'旅行代理：请连续点击同一艘有至少3个空位的飞船。':id===5?'特工：请点击两艘不同飞船，各安排1人。':`请选择第${plan.length+1}/${needed}名宇航员登上的飞船（直接点上面的飞船卡片）。`;$('instruction').textContent=text;$('confirm').textContent='登船选择中 '+plan.length+'/'+needed;$('confirm').disabled=true;return}
let msg='';if(id===0)msg='飞行员：点击要改道的飞船，然后点击目的地区域，再确认。';else if(id===1)msg='士兵：点击火星或火卫一有敌方宇航员的区域，移除其中1名对手；本版暂不提供火卫一分散移动。';else if(id===2)msg='旅行代理：3人已按你的选择登上同一艘船。';else if(id===3)msg='蛇蝎美人：点击一个你与对手都驻守的区域，替换一名对手。';else if(id===4)msg='破坏者：点击要炸毁的停泊飞船。';else if(id===5)msg='特工：点击要提前发射的停泊飞船。';else if(id===6)msg='科学家：本教学版提供2分简化奖励，尚未实现真实事件牌。';else if(id===7)msg='探险家：点击有你宇航员的起点区域，确认后再点击相邻的目的地区域；可以最多移动3步。';else msg='招募员：回收全部已使用职业。';$('instruction').textContent=msg+(selectedShip>=0?'\n已选飞船：'+'ABCD'[selectedShip]:'')+(selectedZone>=0?'\n已选区域：'+Z[selectedZone]:'');$('confirm').disabled=false;$('confirm').textContent='确认职业效果，继续';if(id===0&&selectedShip>=0)$('options').innerHTML='<span class="info">目的地：请点圆形火星地图（含火卫一）</span>';if(id===7&&current.mode==='moveTo'){$('instruction').textContent='探险家：请点击相邻区域。已移动 '+current.moves+'/3步。';$('confirm').textContent='结束移动（可少于3步）'}}
function aiRole(p){let a=roles.map((_,i)=>i).filter(i=>!G.used[p].includes(i));return choose(a)}
function startRound(id){chosenRole=id;let cards=[id,aiRole(1),aiRole(2),aiRole(3)];queue=[0,1,2,3].sort((a,b)=>cards[b]-cards[a]||((a-G.first+4)%4)-((b-G.first+4)%4)).map(p=>({p,id:cards[p]}));note('四人完成秘密选牌，按职业数字倒序揭晓');stage='step';steps=[{title:'🎴 四位玩家已秘密选择职业'}];stepNo=0;draw()}
function advance(){if(!queue.length){endRound();return}current=queue.shift();let {p,id}=current;note(names[p]+'公开 '+(id+1)+'号 '+roles[id][0]);if(p===0){needed=roles[id][1];plan=[];selectedShip=-1;selectedZone=-1;current.mode='board';current.moves=0;if(id===2&&!candidates(3).length){note('旅行代理：没有能容纳3人的船，本次职业效果跳过');finishAction();return}stage='manual';draw()}else{aiAct(p,id);finishAction()}}
function aiAct(p,id){let picks=[],num=roles[id][1];if(id===2){let a=candidates(3);if(a.length)picks=[choose(a),choose(a),choose(a)];if(picks.length)picks=[picks[0],picks[0],picks[0]]}else for(let k=0;k<num;k++){let a=candidates(1,id===5).filter(i=>id!==5||!picks.includes(i));if(!a.length)break;let i=choose(a);G.ships[i].people.push(p);picks.push(i)}if(id===2&&picks.length)for(let i of picks)G.ships[i].people.push(p);note(names[p]+'登船：'+(picks.map(i=>'ABCD'[i]).join('、')||'无空位'));if(id===0){let a=G.ships.map((s,i)=>i).filter(i=>!s.dead);if(a.length){let i=choose(a),z=rnd(10);G.ships[i].dest=z;note(names[p]+'改道 '+ 'ABCD'[i]+'船→'+Z[z])}}if(id===4){let a=G.ships.map((s,i)=>i).filter(i=>!s.launched);if(a.length){let i=choose(a);G.ships[i].dead=true;G.ships[i].people=[];G.ships[i].launched=true;note(names[p]+'炸毁 '+ 'ABCD'[i]+'船')}}if(id===5){let a=G.ships.map((s,i)=>i).filter(i=>!s.launched);if(a.length){let i=choose(a);G.ships[i].launched=true;note(names[p]+'提前发射 '+ 'ABCD'[i]+'船')}}if(id===6){G.scores[p]+=2;note(names[p]+'获得简化科学奖励 +2分')}if(id===8)G.used[p]=[];if(id===7){let a=G.areas.findIndex(x=>x.people.includes(p));if(a>=0&&a<9){let b=(a+1)%9;G.areas[a].people.splice(G.areas[a].people.indexOf(p),1);G.areas[b].people.push(p);G.areas[b].shown=true;note(names[p]+'探险家：'+Z[a]+'→'+Z[b])}}if(id===3){let a=G.areas.find(x=>x.people.includes(p)&&x.people.some(q=>q!==p));if(a)a.people[a.people.findIndex(q=>q!==p)]=p}if(id===1){let a=G.areas.find(x=>x.people.some(q=>q!==p));if(a)a.people.splice(a.people.findIndex(q=>q!==p),1)} }
function finishAction(){let {p,id}=current;G.used[p].push(id);G.ships.forEach((s,i)=>{if(!s.launched&&!s.dead&&s.people.length===s.cap){s.launched=true;note('🚀 '+ 'ABCD'[i]+'船满员发射（暂不降落）')}});stage='step';steps=[{title:'🎭 '+names[p]+'：'+(id+1)+'号 '+roles[id][0]+' 已执行\n'+G.logs.slice(0,5).map(x=>x.split('｜')[1]).join('\n')}];stepNo=0;draw()}
function confirmManual(){let {id}=current;if(current.mode==='board')return;if(current.mode==='moveTo'){finishAction();return}let p=0;for(let i of plan)G.ships[i].people.push(p);note('你亲自安排登船：'+(plan.map(i=>'ABCD'[i]).join('、')||'无'));if(id===0&&selectedShip>=0&&selectedZone>=0){G.ships[selectedShip].dest=selectedZone;note('你将 '+ 'ABCD'[selectedShip]+'船改道→'+Z[selectedZone])}if(id===4&&selectedShip>=0){let s=G.ships[selectedShip];if(!s.launched){s.people=[];s.dead=true;s.launched=true;note('你炸毁 '+ 'ABCD'[selectedShip]+'船')}}if(id===5&&selectedShip>=0){let s=G.ships[selectedShip];if(!s.launched){s.launched=true;note('你令 '+ 'ABCD'[selectedShip]+'船提前发射')}}if(id===6){G.scores[0]+=2;note('科学家简化奖励 +2分')}if(id===8)G.used[0]=[];if(id===3&&selectedZone>=0){let a=G.areas[selectedZone];if(a.people.includes(0)){let j=a.people.findIndex(x=>x!==0);if(j>=0){a.people[j]=0;note('你在'+Z[selectedZone]+'替换一名对手')}}}if(id===1&&selectedZone>=0){let a=G.areas[selectedZone],j=a.people.findIndex(x=>x!==0);if(j>=0){a.people.splice(j,1);note('你移除'+Z[selectedZone]+'的一名对手')}}if(id===7&&selectedZone>=0){let a=G.areas[selectedZone];if(a.people.includes(0)){current.moveFrom=selectedZone;current.moves=0;current.mode='moving';$('instruction').textContent='请选择相邻区域';stage='manual';current.mode='moveTo';selectedZone=-1;draw();return}}finishAction()}
function endRound(){stage='step';steps=[];for(let i=0;i<4;i++){let s=G.ships[i];if(!s.launched)continue;if(!s.dead){G.areas[s.dest].people.push(...s.people);if(s.people.length)G.areas[s.dest].shown=true;note('🪂 '+ 'ABCD'[i]+'船降落 '+Z[s.dest]+'：'+s.people.map(p=>names[p]).join('、'));steps.push({title:'🪂 '+ 'ABCD'[i]+'船降落 '+Z[s.dest]})}G.ships[i]=makeShip()}if([5,8,10].includes(G.round)){let gain=[0,0,0,0];for(let a of G.areas){if(!a.shown)continue;a.pool+=G.round===5?1:G.round===8?2:3;let cs=names.map((_,p)=>count(a.people,p)),mx=Math.max(...cs);if(!mx)continue;let winners=cs.map((n,p)=>n===mx?p:-1).filter(p=>p>=0),share=Math.floor(a.pool/winners.length);for(let p of winners){let v=share*a.value;gain[p]+=v;G.scores[p]+=v}a.pool-=share*winners.length}note('资源结算：'+gain.map((n,p)=>names[p]+' +'+n).join('；'));steps.push({title:'💎 资源结算：'+gain.map((n,p)=>names[p]+' +'+n).join('；')})}if(G.round===10){for(let p=0;p<4;p++)if(G.areas[G.mission[p]].people.includes(p)){G.scores[p]+=5;note(names[p]+'秘密任务完成 +5分')}steps.push({title:'🏆 终局！'+names[G.scores.indexOf(Math.max(...G.scores))]+' 暂列第一'});stage='done';draw();$('game').classList.remove('hidden');$('phase').textContent=steps.map(s=>s.title).join('\n')+'\n'+names.map((n,p)=>n+' '+G.scores[p]+'分').join('；');$('roles').innerHTML='';return}G.round++;G.first=(G.first+1)%4;steps.push({title:'回合结束，准备第'+G.round+'回合'});stage='roundend';$('phase').textContent='本回合飞船已降落，新飞船已补充。';$('roles').innerHTML='';$('next').classList.remove('hidden');$('next').textContent='进入下一回合 ▶';draw();$('next').classList.remove('hidden');$('next').textContent='进入下一回合 ▶'}
$('next').onclick=()=>{if(stage==='roundend'){stage='choose';draw();return}if(stage==='step')advance()};$('confirm').onclick=confirmManual;$('start').onclick=()=>{G.mission[0]=G.offers[missionChoice];stage='choose';draw()};$('reset').onclick=()=>{if(confirm('重新开局？'))fresh()};window.onerror=e=>{alert('游戏错误：'+e);};fresh();
</script></html>
